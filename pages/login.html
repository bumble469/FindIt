<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | FindIt</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="navbar">
    <nav class="nav-inner">
      <a href="../index.html" class="nav-logo">FindIt</a>
      <div class="nav-menu">
        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="items.html">Browse Items</a></li>
          <li><a href="report-lost.html">Report Lost</a></li>
          <li><a href="report-found.html">Report Found</a></li>
          <li><a href="office.html">Campus Office</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-outline">Login</a>
          <a href="signup.html" class="btn btn-primary">Sign Up</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to report and track your items.</p>

      <form id="login-form">
        <div id="form-message" class="form-message" role="alert"></div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>

      <p class="auth-footer">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </main>

  <script src="../js/auth.js"></script>
</body>
</html>
