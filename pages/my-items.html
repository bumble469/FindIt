<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Items | FindIt</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/my-items.css">
</head>
<body data-protected>
  <header class="navbar">
    <nav class="nav-inner">
      <a href="../index.html" class="nav-logo">
        <img src="../assets/images/FindIt_logo.png" alt="FindIt logo">
      </a>
      <div class="nav-menu">
        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="items.html">Browse Items</a></li>
          <li><a href="report.html">Report</a></li>
          <li data-auth="in" hidden><a href="my-items.html">My Items</a></li>
        </ul>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-outline" data-auth="out">Login</a>
          <a href="signup.html" class="btn btn-primary" data-auth="out">Sign Up</a>
          <button type="button" class="btn btn-outline" data-auth="in" data-logout hidden>Logout</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="mi-layout">

    <!-- Left: user details -->
    <aside class="mi-profile" aria-label="Your profile">
      <div class="mi-avatar" id="mi-avatar" aria-hidden="true"></div>
      <h2 class="mi-name" id="mi-name">Your name</h2>
      <ul class="mi-info">
        <li><span aria-hidden="true">✉️</span> <span id="mi-email"></span></li>
        <li><span aria-hidden="true">📅</span> <span id="mi-since"></span></li>
      </ul>

      <div class="mi-stats">
        <div><strong id="stat-lost">0</strong><span>Lost</span></div>
        <div><strong id="stat-found">0</strong><span>Found</span></div>
        <div><strong id="stat-resolved">0</strong><span>Resolved</span></div>
      </div>

      <a href="report.html" class="btn btn-block mi-btn-light">Report an item</a>
    </aside>

    <!-- Right: items -->
    <section class="mi-main">
      <header class="mi-head">
        <h1>My Items</h1>
        <p>Track everything you have reported lost or found.</p>
      </header>

      <div class="mi-tabs" role="tablist" aria-label="Item type">
        <button type="button" class="mi-tab active" role="tab" aria-selected="true" data-tab="lost">
          Items I lost <span class="mi-count" id="count-lost">0</span>
        </button>
        <button type="button" class="mi-tab" role="tab" aria-selected="false" data-tab="found">
          Items I found <span class="mi-count" id="count-found">0</span>
        </button>
      </div>

      <div class="mi-toolbar">
        <div class="mi-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="mi-search" placeholder="Search your items" aria-label="Search your items">
        </div>
        <select id="mi-status" aria-label="Filter by status">
          <option value="all">All statuses</option>
          <option value="open">Open</option>
          <option value="progress">In progress</option>
          <option value="resolved">Resolved</option>
        </select>
      </div>

      <div class="mi-grid" id="mi-grid" aria-live="polite"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/pocketbase/dist/pocketbase.umd.js"></script>
  <script src="../js/pb.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/my-items.js"></script>
</body>
</html>
