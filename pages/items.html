<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Items | FindIt</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/items.css">
</head>
<body>
  <header class="navbar">
    <nav class="nav-inner">
      <a href="../index.html" class="nav-logo">
        <img src="../assets/images/FindIt_logo.png" alt="FindIt logo">
      </a>
      <div class="nav-menu">
        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="items.html" class="active">Browse Items</a></li>
          <li><a href="report-lost.html">Report Lost</a></li>
          <li><a href="report-found.html">Report Found</a></li>
          <li data-auth="in" hidden><a href="my-items.html">My Items</a></li>
        </ul>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-outline" data-auth="out">Login</a>
          <a href="signup.html" class="btn btn-primary" data-auth="out">Sign Up</a>
          <button type="button" class="btn btn-outline" data-auth="in" data-logout hidden>Logout</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">

    <div class="page-head">
      <div>
        <h1>Browse Items</h1>
        <p class="page-sub">Search everything reported lost or found on campus.</p>
      </div>
      <div class="page-head-actions">
        <a href="report-lost.html" class="btn btn-outline">Report Lost Item</a>
        <a href="report-found.html" class="btn btn-primary">Report Found Item</a>
      </div>
    </div>

    <!-- Type filter -->
    <div class="tabs" id="type-tabs" role="tablist" aria-label="Item type">
      <button type="button" class="tab active" role="tab" data-type="all">All <span class="tab-count" id="count-all">0</span></button>
      <button type="button" class="tab" role="tab" data-type="lost">Lost <span class="tab-count" id="count-lost">0</span></button>
      <button type="button" class="tab" role="tab" data-type="found">Found <span class="tab-count" id="count-found">0</span></button>
    </div>

    <!-- Search -->
    <div class="toolbar">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="search" placeholder="Search by item, location or category…" aria-label="Search items">
      </div>
      <button type="button" class="btn btn-outline filters-toggle" id="filters-toggle" aria-expanded="false" aria-controls="filters">Filters</button>
    </div>

    <!-- Filters: status, date, category, sort -->
    <div class="filters" id="filters">
      <div class="filter">
        <label for="filter-status">Status</label>
        <select id="filter-status">
          <option value="all">All statuses</option>
          <option value="open">Open (missing / unclaimed)</option>
          <option value="office">At campus office</option>
          <option value="pending">Claim / match pending</option>
          <option value="returned">Returned / recovered</option>
        </select>
      </div>
      <div class="filter">
        <label for="filter-date">Date</label>
        <select id="filter-date">
          <option value="all">Any time</option>
          <option value="today">Today</option>
          <option value="7">Last 7 days</option>
          <option value="30">Last 30 days</option>
        </select>
      </div>
      <div class="filter">
        <label for="filter-category">Category</label>
        <select id="filter-category">
          <option value="all">All categories</option>
          <option>Electronics</option>
          <option>Bags</option>
          <option>Documents</option>
          <option>Books</option>
          <option>Accessories</option>
          <option>Other</option>
        </select>
      </div>
      <div class="filter">
        <label for="filter-sort">Sort by</label>
        <select id="filter-sort">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
      </div>
      <button type="button" class="btn btn-ghost filter-clear" id="clear-filters">Clear filters</button>
    </div>

    <div class="results-meta">
      <span id="result-count" aria-live="polite"></span>
    </div>

    <div class="item-grid" id="items-grid"></div>

  </main>

  <script src="../js/app.js"></script>
  <script src="../js/items.js"></script>
</body>
</html>
