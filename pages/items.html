<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Items | FindIt</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/items.css">
</head>
<body data-nav="items">
  <header class="navbar">
    <nav class="nav-inner">
      <a href="../index.html" class="nav-logo">
        <img src="../assets/images/FindIt_logo.png" alt="FindIt logo">
      </a>
      <div class="nav-menu">
        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="items.html">Browse Items</a></li>
          <li><a href="report.html">Report</a></li>
          <li data-auth="in" hidden><a href="my-items.html">My Items</a></li>
        </ul>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-outline" data-auth="out">Login</a>
          <a href="signup.html" class="btn btn-primary" data-auth="out">Sign Up</a>
          <button type="button" class="btn btn-outline" data-auth="in" data-logout hidden>Logout</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="br-layout">

    <!-- Banner -->
    <section class="br-banner" aria-label="Search items">
      <div class="br-banner-text">
        <h1>Browse Items</h1>
        <p>Search everything reported lost or found on campus.</p>
      </div>

      <div class="br-banner-tools">
        <div class="br-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="search" placeholder="Search items, locations or categories" aria-label="Search items">
        </div>
        <a href="report.html" class="btn br-btn-light">Report an item</a>
      </div>
    </section>

    <!-- Main card -->
    <section class="br-main">

      <div class="br-tabs" id="type-tabs" role="tablist" aria-label="Item type">
        <button type="button" class="br-tab active" role="tab" aria-selected="true" data-type="all">All <span class="br-count" id="count-all">0</span></button>
        <button type="button" class="br-tab" role="tab" aria-selected="false" data-type="lost">Lost <span class="br-count" id="count-lost">0</span></button>
        <button type="button" class="br-tab" role="tab" aria-selected="false" data-type="found">Found <span class="br-count" id="count-found">0</span></button>
      </div>

      <div class="br-toolbar">
        <select id="filter-category" aria-label="Filter by category">
          <option value="all">All categories</option>
          <option>Electronics</option>
          <option>Bags</option>
          <option>Documents</option>
          <option>Books</option>
          <option>Accessories</option>
          <option>Other</option>
        </select>
        <select id="filter-status" aria-label="Filter by status">
          <option value="all">All statuses</option>
          <option value="open">Open (missing / unclaimed)</option>
          <option value="office">At campus office</option>
          <option value="pending">Claim / match pending</option>
          <option value="returned">Returned / recovered</option>
        </select>
        <select id="filter-date" aria-label="Filter by date">
          <option value="all">Any time</option>
          <option value="today">Today</option>
          <option value="7">Last 7 days</option>
          <option value="30">Last 30 days</option>
        </select>
        <button type="button" class="btn btn-ghost br-clear" id="clear-filters" hidden>Clear filters</button>
      </div>

      <div class="br-results">
        <span class="br-result-count" id="result-count" aria-live="polite"></span>

        <div class="br-results-tools">
          <label for="filter-sort">Sort by</label>
          <select id="filter-sort" class="br-sort">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
          </select>

          <div class="br-view" role="group" aria-label="View">
            <button type="button" class="active" data-view="grid" aria-pressed="true" aria-label="Grid view">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            </button>
            <button type="button" data-view="list" aria-pressed="false" aria-label="List view">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="br-grid" id="items-grid" aria-live="polite"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/pocketbase/dist/pocketbase.umd.js"></script>
  <script src="../js/pb.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/items.js"></script>
</body>
</html>
